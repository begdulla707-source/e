name: Build Stax Client 1.21.11
on:
  push:
    paths:
      - 'stax/source.b64'
      - '.github/workflows/stax-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Unpack Stax source
        run: |
          mkdir -p stax/build
          base64 -d stax/source.b64 > stax/build/source.zip
          cd stax/build
          unzip -q source.zip
      - name: Build Fabric client
        working-directory: stax/build
        run: gradle --no-daemon build --stacktrace
      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: StaxClient-Fabric-1.21.11
          path: stax/build/build/libs/*.jar
          if-no-files-found: error
