name: Build Momentlar APK
on:
  pull_request:
    paths:
      - 'moment-studio/**'
      - '.github/workflows/build-moments.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: moment-studio
      - uses: actions/upload-artifact@v4
        with:
          name: Momentlar-APK
          path: moment-studio/app/build/outputs/apk/debug/app-debug.apk
