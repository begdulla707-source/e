plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.janzakov.moments'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.janzakov.moments'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
